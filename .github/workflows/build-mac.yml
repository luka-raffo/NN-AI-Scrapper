# Compila "Nuevos Negocios AI.app" en una Mac de GitHub, lo abre y le hace una
# prueba de humo. El .zip queda en la pestaña Actions -> la corrida -> Artifacts.
name: Build Mac

on:
  workflow_dispatch:
  push:
    paths:
      - "Recursos/Scrapper Meli L1/**"
      - "Recursos/htmlMvpNuevosNegociosAI.html"
      - ".github/workflows/build-mac.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon (arm64)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: "Recursos/Scrapper Meli L1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar .app
        run: bash mac/build_mac.sh

      - name: Prueba de humo (abrir el .app y consultar)
        run: |
          set -u
          "dist/Nuevos Negocios AI.app/Contents/MacOS/NuevosNegociosAI" &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          echo
          curl -sf -o /dev/null -w "web: %{http_code} %{size_download}B\n" http://127.0.0.1:8000/
          curl -sf "http://127.0.0.1:8000/categorias?pais=AR&nivel=l1" | python3 -c "import sys,json; print('categorias AR:', len(json.load(sys.stdin)))"
          # Scrape real. La IP de GitHub es de datacenter: si MELI la bloquea no
          # es un fallo del .app, por eso se informa y no corta el build.
          sleep 20
          for id in MLA1051 MLB1051; do
            curl -s -m 150 "http://127.0.0.1:8000/mas-vendidos/$id" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$id:', d.get('cantidad'), d.get('detail',''))" || true
          done
          curl -s -m 60 "http://127.0.0.1:8000/amazon?q=Celulares&site=US" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Amazon US:', d.get('cantidad'), d.get('detail',''))" || true
          echo "--- Detener App.command ---"
          bash "mac/Detener App.command"
          sleep 3
          echo "Chrome del motor que quedaron abiertos: $(pgrep -f undetected_chromedriver | wc -l | tr -d ' ')"
          echo "--- app.log ---"
          cat ~/Library/Logs/NuevosNegociosAI/app.log || true
          # La app tiene que haber levantado y servido la web; eso si corta.
          grep -q "Levantando backend" ~/Library/Logs/NuevosNegociosAI/app.log

      - uses: actions/upload-artifact@v4
        with:
          name: NuevosNegociosAI-mac-${{ runner.arch }}
          path: "Recursos/Scrapper Meli L1/dist/NuevosNegociosAI-mac-*.zip"
          if-no-files-found: error
